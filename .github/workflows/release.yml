name: Release

# Publishes to npm with trusted publishing (OIDC): no npm token is stored anywhere.
# npmjs.com must list this repository and this workflow file ("release.yml") as the
# package's trusted publisher. Push a tag that matches package.json's version, e.g.:
#   npm version patch && git push --follow-tags

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Trusted publishing needs npm 11.5.1 or later
        run: npm install -g npm@11.6.2 && npm --version
      - name: The tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}." >&2
            exit 1
          fi
      - name: Skip a version npm already has
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "drillplot@${version}" version >/dev/null 2>&1; then
            echo "drillplot ${version} is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: npm ci
      # prepublishOnly runs the typecheck, the tests and the build first.
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
