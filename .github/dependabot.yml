version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait two weeks after a release before proposing it.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait two weeks after a release before proposing it.
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
